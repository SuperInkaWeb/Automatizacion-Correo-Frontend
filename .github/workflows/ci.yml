# ─────────────────────────────────────────────────────────────────────
# Integracion continua del frontend.
#
# El trabajo `contrato` es el que sustituye al monorepo: descarga el
# openapi.json que versiona el backend, regenera el cliente y falla si
# hay diferencias sin commitear. Es lo que hace imposible que el
# contrato se desincronice en silencio (ADR 015).
# ─────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  # Linting, tipado, tests y auditoria en un solo trabajo: los cuatro
  # necesitan el mismo `npm ci`, y repartirlos multiplicaba esa
  # instalacion sin ganar nada. Cada paso lleva nombre propio, asi que
  # un fallo sigue siendo localizable sin abrir el log.
  verificacion:
    name: Verificacion
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`: gitleaks escanea un rango de commits y el clon
      # superficial por defecto no incluye el padre del rango, lo que hace
      # que `git log` avise por stderr y gitleaks lo tome por un fallo de
      # escaneo. Solo aparece cuando el push trae mas de un commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Linting
        run: npm run lint

      - name: Tipado
        run: npm run typecheck

      - name: Tests
        run: npm run test

      # Dos auditorias con distinto rigor, a proposito.
      #
      # Produccion: tolerancia cero desde severidad moderada. Es el
      # codigo que se sirve al navegador.
      #
      # Desarrollo: solo se corta ante criticas. Quedan avisos de
      # severidad alta en la cadena de `eslint-config-next`
      # (fast-glob -> micromatch -> braces) SIN version parcheada
      # disponible: el rango afectado es `*`. Hacer fallar el pipeline
      # por algo que nadie puede arreglar solo entrena al equipo a
      # ignorar el trabajo en rojo.
      - name: Dependencias de produccion
        run: npm audit --omit=dev --audit-level=moderate

      - name: Dependencias de desarrollo
        run: npm audit --audit-level=critical

      - name: Buscar secretos en el historial
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contrato:
    name: Contrato de API sincronizado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Regenerar el cliente desde el contrato del backend
        run: npm run api:generate

      - name: Comprobar que no hay deriva
        run: |
          git diff --exit-code src/generated \
            || { echo "::error::El cliente generado esta desactualizado. Ejecuta 'npm run api:generate' y commitea el resultado."; exit 1; }

  # ───────────────────────────────────────────────────────────────────
  # E2E en un navegador real.
  #
  # Cubre lo que `vitest` no alcanza: la comprobacion de sesion, que vive
  # en un Server Component y en un `redirect`; el progreso en vivo, que
  # necesita un `EventSource` de verdad; y la navegacion entre paginas del
  # listado por cursor.
  #
  # Va despues de `verificacion` porque Playwright descarga un navegador:
  # no tiene sentido pagar ese minuto si el tipado ya esta roto.
  # ───────────────────────────────────────────────────────────────────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [verificacion]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Solo Chromium: los tres navegadores triplicarian el tiempo para
      # verificar flujos que no dependen del motor. Las diferencias entre
      # navegadores son un problema de estilos, no de estos tests.
      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      # El propio `playwright.config.ts` arranca el servidor con el build
      # de produccion y le pasa el entorno que necesita, incluido el
      # secreto de sesion con el que la suite sella su cookie.
      - name: Ejecutar la suite
        run: npx playwright test

      - name: Publicar el informe si algo fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7

  build:
    name: Construccion
    runs-on: ubuntu-latest
    needs: [verificacion]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # El secreto se genera en el momento y no se escribe en el
      # fichero. Un literal con forma de clave en un workflow es
      # indistinguible de una fuga real para cualquier escaner, y
      # acostumbrarse a verlo es como se acaba ignorando una de verdad.
      - name: Generar secreto efimero para el build
        run: echo "SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build de produccion
        run: npm run build
        env:
          # Valores minimos para que la validacion de entorno no aborte
          # el build. No son credenciales reales.
          API_URL: http://localhost:8000
          APP_URL: http://localhost:3000
          OIDC_ISSUER: https://ci.ejemplo.com
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci
          OIDC_AUDIENCE: https://api.ejemplo.com

